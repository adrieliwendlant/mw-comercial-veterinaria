<style>
  /* Paleta da marca: 446 C (grafite) no fundo, 7709 C (azul-petróleo) nos botões,
     7457 C nos realces. Mesmas cores do site e das planilhas. */
  :root{
    --grafite:#444953; --grafite-esc:#3a3f48;
    --teal:#7CA9B4; --teal-esc:#6b98a3; --claro:#C9DBDE;
    --branco:#FFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--grafite); color:var(--branco);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:38px 18px 30px;
  }
  .wrap{width:100%;max-width:520px;text-align:center}
  .logo{width:100%;max-width:250px;height:auto;display:block;margin:0 auto 26px}

  /* Botão-pílula. O alvo tem 58px de altura: dedo em tela de celular precisa
     de área, e a lista é usada quase só pelo Instagram. */
  .lnk{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;min-height:58px;padding:13px 46px;margin-bottom:13px;
    background:var(--teal);color:var(--branco);
    border:1px solid var(--teal);border-radius:34px;
    font-size:16px;font-weight:500;text-decoration:none;line-height:1.25;
    transition:transform .12s ease, background .18s ease;
  }
  .lnk:hover{background:var(--teal-esc);transform:translateY(-2px)}
  .lnk:active{transform:translateY(0)}
  .lnk svg{flex:0 0 auto}

  /* O evento é o único item com prazo — inverte as cores pra não se perder
     no meio dos botões fixos, que ficam ali o ano todo. */
  .lnk.destaque{
    background:var(--branco);color:var(--grafite);border-color:var(--branco);
    flex-direction:column;gap:3px;padding:12px 30px;font-weight:700;
  }
  .lnk.destaque:hover{background:var(--claro);border-color:var(--claro)}
  .lnk.destaque .sub{font-size:12px;font-weight:500;color:#5c6470;letter-spacing:.01em}
  .tag{
    display:inline-block;background:var(--teal);color:var(--branco);
    font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;margin-bottom:2px;
  }

  /* Contato: é a informação que faltava — quem chega pelo Instagram não tinha
     endereço, telefone fixo nem e-mail em lugar nenhum desta página. */
  .info{
    margin-top:22px;padding:16px 18px;border:1px solid rgba(201,219,222,.22);
    border-radius:14px;text-align:left;
  }
  .info h2{
    margin:0 0 11px;font-size:10.5px;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;color:var(--teal);
  }
  .info a,.info div{
    display:flex;align-items:flex-start;gap:10px;
    font-size:13.5px;line-height:1.45;color:var(--claro);text-decoration:none;
    padding:5px 0;
  }
  .info a:hover{color:var(--branco)}
  .info .ic{flex:0 0 17px;opacity:.75;padding-top:1px}

  .social{display:flex;justify-content:center;gap:22px;margin:26px 0 6px}
  .social a{color:var(--claro);opacity:.85;transition:opacity .15s ease,transform .15s ease}
  .social a:hover{opacity:1;transform:translateY(-2px)}

  footer{margin-top:14px;font-size:11px;color:rgba(201,219,222,.5);line-height:1.6}

  @media (max-width:380px){
    .lnk{font-size:15px;padding:13px 30px}
    .logo{max-width:210px}
  }
  @media (prefers-reduced-motion:reduce){
    .lnk,.social a{transition:none}
    .lnk:hover,.social a:hover{transform:none}
  }
</style>
</head>

<script>
async function carregarBio(){
  const box = document.getElementById('eventosBio');
  try {
    const r = await fetch('https://promotoresapp.mwcomercialveterinaria.com.br/representantesmw/campo.php?tipo=bio', {cache:'no-store'});
    const j = await r.json(); if (!r.ok || !j.ok || !Array.isArray(j.eventos)) throw new Error();
    const cards = j.eventos.map(ev => {
      const aberta = ev.inscricoesAbertas !== false;
      const card = document.createElement(aberta ? 'a' : 'div'); card.className = 'lnk destaque';
      if (aberta) {
        const url = new URL('inscricao.html', location.href);
        url.search = new URLSearchParams({ev:ev.id,k:ev.chaveInscricao,publico:'1'}).toString();
        card.href = url.href;
      }
      const tag = document.createElement('span'); tag.className='tag';
      tag.textContent = aberta ? 'Inscrições abertas' : 'Inscrições encerradas';
      const title = document.createElement('span'); title.textContent='🎟 '+ev.nome;
      const sub = document.createElement('span'); sub.className='sub';
      sub.textContent=[String(ev.data||'').split('-').reverse().join('/'),ev.horario,ev.local].filter(Boolean).join(' · ');
      card.append(tag,title,sub); return card;
    });
    box.replaceChildren(...cards);
  } catch(e) { box.textContent='Não foi possível carregar os eventos. Tente novamente em instantes.'; }
}
carregarBio();
setInterval(carregarBio,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) carregarBio();});
</script>
